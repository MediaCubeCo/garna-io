services:
  taxes:
    build: .
    command: ["sh", "-c", "uv run manage.py migrate --noinput && uv run gunicorn taxes.wsgi --bind 0.0.0.0:8000"]
    env_file: .env
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./countries.json:/app/countries.json:ro

    restart: unless-stopped

  cloudflare:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKENX}
    restart: unless-stopped
