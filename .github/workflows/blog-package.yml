name: Verify packaged blog integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@mediacubeco'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx blog-migrations migrations && git diff --exit-code -- migrations
      - run: npx tsc --noEmit
      # The pre-existing ForCreators architecture failure is documented in
      # docs/blog-engine-rollout.md; this job verifies the integration scope.
      - run: npx vitest run test/blog.spec.ts test/index.spec.ts test/eor-cost-inputs.spec.ts
      - run: npm run build
      - run: npx wrangler deploy --dry-run
